<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="hubBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#F2EDE4" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B996" />
      <stop offset="100%" stop-color="#B38E5D" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Warm Alabaster Tile -->
  <rect width="64" height="64" rx="16" fill="url(#hubBg)" stroke="#E5DDD0" stroke-width="1.5" />

  <!-- Architectural Spa Design Hub Monogram / Pavilion Emblem -->
  <g transform="translate(32, 32)">
    <!-- Outer Diamond / Pavilion Frame -->
    <polygon points="0,-22 22,0 0,22 -22,0" fill="none" stroke="url(#goldGradient)" stroke-width="1.8" />
    
    <!-- Inner Architectural Arch -->
    <path d="M-13,12 C-13,-5 13,-5 13,12" fill="none" stroke="#191512" stroke-width="1.8" stroke-linecap="round" />
    
    <!-- Central Sanctuary Pillar & Lotus Crest -->
    <line x1="0" y1="-14" x2="0" y2="12" stroke="url(#goldGradient)" stroke-width="1.8" stroke-linecap="round" />
    
    <!-- Crown Petal / Star -->
    <circle cx="0" cy="-6" r="3.2" fill="#191512" />
    <circle cx="0" cy="-6" r="1.8" fill="url(#goldGradient)" />

    <!-- Corner Accents -->
    <circle cx="0" cy="-22" r="1.5" fill="url(#goldGradient)" />
    <circle cx="22" cy="0" r="1.5" fill="url(#goldGradient)" />
    <circle cx="0" cy="22" r="1.5" fill="url(#goldGradient)" />
    <circle cx="-22" cy="0" r="1.5" fill="url(#goldGradient)" />
  </g>
</svg>
