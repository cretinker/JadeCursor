<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="hubFavBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#F2EDE4" />
    </linearGradient>
    <linearGradient id="hubFavGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E7D0" />
      <stop offset="40%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#8E7350" />
    </linearGradient>
    <linearGradient id="hubFavGoldCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#D4B996" />
      <stop offset="100%" stop-color="#A8824C" />
    </linearGradient>
  </defs>

  <!-- Background Warm Alabaster Medallion -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#hubFavBg)" stroke="url(#hubFavGold)" stroke-width="1.8" />
  <rect x="6.5" y="6.5" width="51" height="51" rx="12" fill="none" stroke="rgba(197, 168, 128, 0.35)" stroke-width="1" />

  <!-- Architectural Spa Design Hub Monogram / Sanctuary Pavilion -->
  <g transform="translate(32, 32)">
    <!-- Outer Diamond Frame -->
    <polygon points="0,-19 19,0 0,19 -19,0" fill="none" stroke="url(#hubFavGold)" stroke-width="1.8" />
    
    <!-- Symmetrical Architectural Wellness Arches -->
    <path d="M-11,11 C-11,-2 0,-5 0,-15 C0,-5 11,-2 11,11" fill="none" stroke="#191512" stroke-width="2" stroke-linecap="round" />
    <path d="M-6.5,11 C-6.5,2 0,0 0,-9.5 C0,0 6.5,2 6.5,11" fill="none" stroke="url(#hubFavGoldCore)" stroke-width="1.6" stroke-linecap="round" />
    
    <!-- Base Sanctuary Hairline -->
    <line x1="-14" y1="11" x2="14" y2="11" stroke="url(#hubFavGold)" stroke-width="1.6" stroke-linecap="round" />
    
    <!-- Zenith Diamond Crest -->
    <polygon points="0,-19 3.5,-14.5 0,-10 -3.5,-14.5" fill="url(#hubFavGold)" />
    
    <!-- Center Radiant Jewel -->
    <circle cx="0" cy="1.5" r="2.2" fill="#191512" />
    <circle cx="0" cy="1.5" r="1.2" fill="url(#hubFavGoldCore)" />
  </g>
</svg>
